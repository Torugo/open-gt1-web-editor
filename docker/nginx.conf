server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    # Let the browser ask for MIDI access on this page
    add_header Permissions-Policy "midi=(self)" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }
}
